name: Daily Bonus (read-only diagnosis)

on:
  push:
    branches:
      - codex/yamibo-cloud-diagnosis-20261017

jobs:
  checkin:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest

    env:
      YAMIBO_USERNAME: ${{ secrets.YAMIBO_USERNAME }}
      YAMIBO_PASSWORD: ${{ secrets.YAMIBO_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set timezone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: Echo current time
        run: timedatectl

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: |
          uv run playwright install chromium --with-deps
          uv run patchright install chromium

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Read-only Yamibo diagnosis
        run: xvfb-run -a uv run --frozen python tools/yamibo_browser_probe.py --from-env
